<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pruebas técnicas de Dragon Board</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #bbb; padding: 0.5rem; text-align: left; }
        .pass { color: #08752b; }
        .fail { color: #b00020; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Pruebas técnicas de Dragon Board</h1>
    <p id="test-summary">Ejecutando…</p>
    <table>
        <thead>
            <tr><th>Prueba</th><th>Estado</th><th>Detalle</th></tr>
        </thead>
        <tbody id="test-results"></tbody>
    </table>

    <!-- DOM mínimo exigido por script.js; no forma parte de la aplicación. -->
    <div id="fixture" style="position: fixed; left: -10000px; top: 0;">
        <div id="chessboard"></div>
        <div id="moves-list"></div>
        <p id="game-status"></p>
        <button id="reset-btn">Nueva partida</button>

        <div id="promotion-modal" class="hidden">
            <button data-promotion="q"><span data-promotion-symbol></span><span>Dama</span></button>
            <button data-promotion="r"><span data-promotion-symbol></span><span>Torre</span></button>
            <button data-promotion="b"><span data-promotion-symbol></span><span>Alfil</span></button>
            <button data-promotion="n"><span data-promotion-symbol></span><span>Caballo</span></button>
            <button id="cancel-promotion">Cancelar</button>
        </div>

        <div id="result-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="result-title" aria-describedby="result-summary">
            <h2 id="result-title">Partida finalizada</h2>
            <p id="result-summary"></p>
            <span id="result-code"></span>
            <span id="result-winner"></span>
            <span id="result-loser"></span>
            <span id="result-reason"></span>
            <button id="review-position">Revisar posición</button>
            <button id="new-game">Nueva partida</button>
        </div>
    </div>

    <script src="../vendor/chess.js"></script>
    <script src="../script.js"></script>
    <script src="technical-tests.js"></script>
</body>
</html>
